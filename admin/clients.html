<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Client Submissions</title>
  <link rel="stylesheet" href="../css/index.css">
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      margin: 0;
      background: #f9fafb;
      color: #111827;
    }

    .admin-container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
    }

    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      padding-bottom: 1.5rem;
      border-bottom: 2px solid rgba(17, 24, 39, 0.1);
    }

    .admin-header h1 {
      font-size: 2rem;
      margin: 0;
      letter-spacing: -0.03em;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.65rem 1.25rem;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid rgba(17, 24, 39, 0.1);
      font-size: 0.9rem;
      font-weight: 500;
      text-decoration: none;
      color: inherit;
      transition: all 0.3s ease;
    }

    .back-link:hover {
      background: #fff;
      border-color: rgba(17, 24, 39, 0.25);
      transform: translateX(-4px);
    }

    .back-link svg {
      width: 1.25rem;
      height: 1.25rem;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .stat-card {
      background: #fff;
      padding: 1.5rem;
      border-radius: 1rem;
      border: 1px solid rgba(17, 24, 39, 0.08);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
    }

    .stat-label {
      font-size: 0.875rem;
      color: rgba(17, 24, 39, 0.6);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.5rem;
    }

    .stat-value {
      font-size: 2rem;
      font-weight: 700;
      color: #000;
    }

    .submissions-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }

    .submissions-header h2 {
      font-size: 1.5rem;
      margin: 0;
    }

    .filter-buttons {
      display: flex;
      gap: 0.5rem;
    }

    .filter-btn {
      padding: 0.5rem 1rem;
      border-radius: 999px;
      border: 1px solid rgba(17, 24, 39, 0.15);
      background: #fff;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .filter-btn.active {
      background: #000;
      color: #fff;
      border-color: #000;
    }

    .submissions-list {
      display: grid;
      gap: 1.25rem;
    }

    .submission-card {
      background: #fff;
      border: 1px solid rgba(17, 24, 39, 0.08);
      border-radius: 1.25rem;
      padding: 1.75rem;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
      transition: all 0.3s ease;
    }

    .submission-card:hover {
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    }

    .submission-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 1rem;
    }

    .submission-info h3 {
      font-size: 1.25rem;
      margin: 0 0 0.35rem;
    }

    .submission-meta {
      display: flex;
      gap: 1rem;
      font-size: 0.875rem;
      color: rgba(17, 24, 39, 0.6);
    }

    .status-badge {
      padding: 0.35rem 0.85rem;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .status-new {
      background: #dbeafe;
      color: #1e40af;
    }

    .status-contacted {
      background: #fef3c7;
      color: #92400e;
    }

    .status-completed {
      background: #d1fae5;
      color: #065f46;
    }

    .submission-details {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
      margin-bottom: 1.25rem;
      padding: 1.25rem;
      background: rgba(248, 250, 252, 0.8);
      border-radius: 0.75rem;
    }

    .detail-item {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .detail-label {
      font-size: 0.75rem;
      font-weight: 700;
      color: rgba(17, 24, 39, 0.5);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .detail-value {
      font-size: 0.95rem;
      font-weight: 600;
      color: #111827;
    }

    .submission-message {
      margin-bottom: 1.25rem;
    }

    .submission-message h4 {
      font-size: 0.875rem;
      font-weight: 700;
      color: rgba(17, 24, 39, 0.6);
      text-transform: uppercase;
      margin: 0 0 0.5rem;
    }

    .submission-message p {
      margin: 0;
      line-height: 1.6;
      color: rgba(17, 24, 39, 0.8);
    }

    .submission-actions {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .action-btn {
      padding: 0.65rem 1.25rem;
      border-radius: 999px;
      border: 1px solid rgba(17, 24, 39, 0.15);
      background: #fff;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }

    .action-btn:hover {
      background: #f9fafb;
      border-color: rgba(17, 24, 39, 0.3);
    }

    .action-btn.delete {
      color: #dc2626;
      border-color: #fecaca;
    }

    .action-btn.delete:hover {
      background: #fef2f2;
      border-color: #dc2626;
    }

    .action-btn svg {
      width: 1rem;
      height: 1rem;
    }

    .empty-state {
      text-align: center;
      padding: 4rem 2rem;
      color: rgba(17, 24, 39, 0.5);
    }

    .empty-state svg {
      width: 4rem;
      height: 4rem;
      margin-bottom: 1rem;
      opacity: 0.3;
    }

    @media (max-width: 768px) {
      .admin-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 1rem;
      }

      .submission-header {
        flex-direction: column;
        gap: 1rem;
      }

      .submission-details {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="admin-container">
    <header class="admin-header">
      <h1>Client Submissions</h1>
      <a href="../index.html" class="back-link">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18" />
        </svg>
        Back to Portfolio
      </a>
    </header>

    <div class="stats">
      <div class="stat-card">
        <div class="stat-label">Total</div>
        <div class="stat-value" id="totalCount">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">New</div>
        <div class="stat-value" id="newCount">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Contacted</div>
        <div class="stat-value" id="contactedCount">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Completed</div>
        <div class="stat-value" id="completedCount">0</div>
      </div>
    </div>

    <div class="submissions-header">
      <h2>All Submissions</h2>
      <div class="filter-buttons">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="new">New</button>
        <button class="filter-btn" data-filter="contacted">Contacted</button>
        <button class="filter-btn" data-filter="completed">Completed</button>
      </div>
    </div>

    <div class="submissions-list" id="submissionsList">
      <div class="empty-state">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h3.75M9 15h3.75M9 18h3.75m3 .75H18a2.25 2.25 0 0 0 2.25-2.25V6.108c0-1.135-.845-2.098-1.976-2.192a48.424 48.424 0 0 0-1.123-.08m-5.801 0c-.065.21-.1.433-.1.664 0 .414.336.75.75.75h4.5a.75.75 0 0 0 .75-.75 2.25 2.25 0 0 0-.1-.664m-5.8 0A2.251 2.251 0 0 1 13.5 2.25H15c1.012 0 1.867.668 2.15 1.586m-5.8 0c-.376.023-.75.05-1.124.08C9.095 4.01 8.25 4.973 8.25 6.108V8.25m0 0H4.875c-.621 0-1.125.504-1.125 1.125v11.25c0 .621.504 1.125 1.125 1.125h9.75c.621 0 1.125-.504 1.125-1.125V9.375c0-.621-.504-1.125-1.125-1.125H8.25ZM6.75 12h.008v.008H6.75V12Zm0 3h.008v.008H6.75V15Zm0 3h.008v.008H6.75V18Z" />
        </svg>
        <p>No submissions yet</p>
      </div>
    </div>
  </div>

  <script>
    let allSubmissions = [];
    let currentFilter = 'all';

    function loadSubmissions() {
      allSubmissions = JSON.parse(localStorage.getItem('projectSubmissions') || '[]');
      updateStats();
      renderSubmissions();
    }

    function updateStats() {
      document.getElementById('totalCount').textContent = allSubmissions.length;
      document.getElementById('newCount').textContent = allSubmissions.filter(s => s.status === 'new').length;
      document.getElementById('contactedCount').textContent = allSubmissions.filter(s => s.status === 'contacted').length;
      document.getElementById('completedCount').textContent = allSubmissions.filter(s => s.status === 'completed').length;
    }

    function renderSubmissions() {
      const list = document.getElementById('submissionsList');
      const filtered = currentFilter === 'all'
        ? allSubmissions
        : allSubmissions.filter(s => s.status === currentFilter);

      if (filtered.length === 0) {
        list.innerHTML = `
          <div class="empty-state">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h3.75M9 15h3.75M9 18h3.75m3 .75H18a2.25 2.25 0 0 0 2.25-2.25V6.108c0-1.135-.845-2.098-1.976-2.192a48.424 48.424 0 0 0-1.123-.08m-5.801 0c-.065.21-.1.433-.1.664 0 .414.336.75.75.75h4.5a.75.75 0 0 0 .75-.75 2.25 2.25 0 0 0-.1-.664m-5.8 0A2.251 2.251 0 0 1 13.5 2.25H15c1.012 0 1.867.668 2.15 1.586m-5.8 0c-.376.023-.75.05-1.124.08C9.095 4.01 8.25 4.973 8.25 6.108V8.25m0 0H4.875c-.621 0-1.125.504-1.125 1.125v11.25c0 .621.504 1.125 1.125 1.125h9.75c.621 0 1.125-.504 1.125-1.125V9.375c0-.621-.504-1.125-1.125-1.125H8.25ZM6.75 12h.008v.008H6.75V12Zm0 3h.008v.008H6.75V15Zm0 3h.008v.008H6.75V18Z" />
            </svg>
            <p>No ${currentFilter === 'all' ? '' : currentFilter} submissions</p>
          </div>
        `;
        return;
      }

      list.innerHTML = filtered.map(sub => `
        <div class="submission-card">
          <div class="submission-header">
            <div class="submission-info">
              <h3>${sub.name}</h3>
              <div class="submission-meta">
                <span>${new Date(sub.submittedAt).toLocaleDateString()}</span>
                <span>${new Date(sub.submittedAt).toLocaleTimeString()}</span>
              </div>
            </div>
            <span class="status-badge status-${sub.status}">${sub.status}</span>
          </div>

          <div class="submission-details">
            <div class="detail-item">
              <div class="detail-label">Service</div>
              <div class="detail-value">${sub.service}</div>
            </div>
            <div class="detail-item">
              <div class="detail-label">Email</div>
              <div class="detail-value">${sub.email}</div>
            </div>
            <div class="detail-item">
              <div class="detail-label">Company</div>
              <div class="detail-value">${sub.company}</div>
            </div>
            <div class="detail-item">
              <div class="detail-label">Budget</div>
              <div class="detail-value">${sub.budget}</div>
            </div>
          </div>

          <div class="submission-message">
            <h4>Project Details</h4>
            <p>${sub.message}</p>
          </div>

          <div class="submission-actions">
            ${sub.status === 'new' ? `
              <button class="action-btn" onclick="updateStatus('${sub.id}', 'contacted')">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
                </svg>
                Mark as Contacted
              </button>
            ` : ''}
            ${sub.status === 'contacted' ? `
              <button class="action-btn" onclick="updateStatus('${sub.id}', 'completed')">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
                </svg>
                Mark as Completed
              </button>
            ` : ''}
            <button class="action-btn delete" onclick="deleteSubmission('${sub.id}')">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0" />
              </svg>
              Delete
            </button>
          </div>
        </div>
      `).join('');
    }

    function updateStatus(id, status) {
      allSubmissions = allSubmissions.map(sub =>
        sub.id === id ? { ...sub, status } : sub
      );
      localStorage.setItem('projectSubmissions', JSON.stringify(allSubmissions));
      loadSubmissions();
    }

    function deleteSubmission(id) {
      if (confirm('Are you sure you want to delete this submission?')) {
        allSubmissions = allSubmissions.filter(sub => sub.id !== id);
        localStorage.setItem('projectSubmissions', JSON.stringify(allSubmissions));
        loadSubmissions();
      }
    }

    // Filter buttons
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        renderSubmissions();
      });
    });

    // Initial load
    loadSubmissions();

    // Auto refresh every 30 seconds
    setInterval(loadSubmissions, 30000);
  </script>
</body>
</html>
